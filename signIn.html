<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an account - AnimalLook</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="top-banner">
      <span class="brand-name">AnimalLook</span>
      <span class="logo-placeholder" role="img" aria-label="Placeholder logo">Logo</span>
    </header>
    <main>
      <h1>Create an account</h1>
      <form class="auth-form" data-auth-form="register">
        <label for="register-email">Email</label>
        <input id="register-email" name="email" type="email" autocomplete="email" required>
        <label for="register-password">Password</label>
        <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="6" required>
        <button type="submit">Create account</button>
        <p class="auth-message" role="status" aria-live="polite"></p>
        <p>Already have an account? <a class="auth-inline-link" href="login.html">Log in</a></p>
      </form>
    </main>
    <div class="bottom-bar">
      <a href="index.html"><img src="images/icon-27.svg" alt="Home"></a>
      <a href="pictures.html"><img src="images/icon-31.svg" alt="Pictures"></a>
      <a href="appointments.html"><img src="images/icon-33.svg" alt="Appointments"></a>
      <a href="locationalTools.html"><img src="images/icon-25.svg" alt="Locational tools"></a>
      <a href="settings.html"><img src="images/icon-29.svg" alt="Settings"></a>
    </div>
    <script src="theme.js"></script>
    <script type="module" src="auth-ui.js"></script>
  </body>
</html>

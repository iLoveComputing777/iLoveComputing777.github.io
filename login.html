<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - AnimalLook</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="top-banner">
      <span class="brand-name">AnimalLook</span>
      <img class="banner-logo" src="images/webLogo.png" alt="AnimalLook logo">
    </header>
    <div id="appointment-alert" class="appointment-alert" role="status" aria-live="polite" hidden>Appointment soon</div>
    <main>
      <h1>Log in</h1>
      <form class="auth-form" data-auth-form="login">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="email" required>
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Log in</button>
        <p class="auth-message" role="status" aria-live="polite"></p>
        <p>New to AnimalLook? <a class="auth-inline-link" href="signIn.html">Create an account</a></p>
      </form>
    </main>
    <div class="bottom-bar">
      <a href="index.html"><img src="images/icon-27.svg" alt="Home"></a>
      <a href="pictures.html"><img src="images/icon-31.svg" alt="Pictures"></a>
      <a href="appointments.html"><img src="images/icon-33.svg" alt="Appointments"></a>
      <a href="locationalTools.html"><img src="images/icon-25.svg" alt="Locational tools"></a>
      <a href="settings.html"><img src="images/icon-29.svg" alt="Settings"></a>
    </div>
    <script src="theme.js"></script>
    <script type="module" src="auth-ui.js"></script>
    <script type="module" src="appointment-manager.js"></script>
  </body>
</html>

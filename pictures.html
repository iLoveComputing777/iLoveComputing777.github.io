<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pictures - AnimalLook</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="auth-pending" data-auth-required>
    <header class="top-banner">
      <span class="brand-name">AnimalLook</span>
      <img class="banner-logo" src="images/webLogo.png" alt="AnimalLook logo">
    </header>
    <div id="appointment-alert" class="appointment-alert" role="status" aria-live="polite" hidden>Appointment soon</div>
    <main class="pictures-page">
      <h1>Pictures</h1>
      <figure class="animal-picture-card">
        <img id="animal-picture" alt="">
        <figcaption>
          <h2 id="animal-picture-name"></h2>
          <section class="animal-picture-description" aria-labelledby="animal-picture-description-heading">
            <h3 id="animal-picture-description-heading">Description</h3>
            <p id="animal-picture-description"></p>
          </section>
          <button id="next-animal-picture" class="picture-next-button" type="button">Next picture</button>
        </figcaption>
      </figure>
    </main>
    <div class="bottom-bar">
      <a href="index.html"><img src="images/icon-27.svg" alt="Home"></a>
      <a href="pictures.html"><img src="images/icon-31.svg" alt="Pictures"></a>
      <a href="appointments.html"><img src="images/icon-33.svg" alt="Appointments"></a>
      <a href="locationalTools.html"><img src="images/icon-25.svg" alt="Locational tools"></a>
      <a href="settings.html"><img src="images/icon-29.svg" alt="Settings"></a>
    </div>
    <script src="theme.js"></script>
    <script type="module" src="auth-ui.js"></script>
    <script type="module" src="appointment-manager.js"></script>
    <script type="module" src="pictures.js"></script>
  </body>
</html>
